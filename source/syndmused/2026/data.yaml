-
    path: /syndmused/2026/chrous-menticum-juubel-Tallinn
    pealkiri: Politseikoori Chorus Menticum juubelikontsert "Nõnda palju elu"
    asukoht: 24. mail 2026 kell 18.00 Von Krahli Teatris (Telliskivi tn 60a/9, 10412 Tallinn)
    sisu: | 
        Politseikoor Chorus Menticum tähistab oma 15. sünnipäeva suurejoonelise juubelikontserdiga!
 
        Tegemist on koori senise tegevuse suurima kontserdiga, mida lavastab Ain Mäeots ning kus lisaks muusikale saab näha ka lühikesi sooja huumoriga rikastatud videoklippe koori senisest teest ja politseitööst ning kus astuvad kooriliikmete kõrval üles Vanemuise näitlejad. 

        Kontserdi repertuaar on helge ja kaunikõlaline ning koori on saatmas Tallinna politseiorkestri svingbänd Siim Aimla juhatamisel.
        
        Dirigent Eve Paap, koormeister Ingrid Pihelgas, mõtiskleb Riho Tamm.

        <a href="/assets/event_imgs/2026/PLAKAT-Chorus-Menticum-15-Ulvi-Jukk.png" data-lightbox="PLAKAT-Chorus-Menticum-15-Ulvi-Jukk.png"><img src="/assets/event_imgs/2026/PLAKAT-Chorus-Menticum-15-Ulvi-Jukk.png" style="width:480px"></a>
        
        Pilet: 10 EUR (lapsed ja pensionärid tasuta), <a href="https://fienta.com/et/chorus-menticum-vonkrahl" target="_blank" rel="noopener">Fientas</a>
        
        <a href="https://www.facebook.com/chorusmenticum/" target="_blank" rel="noopener">Koori leht Facebookis</a>


