-
    path: /syndmused/2026/emakeelepaev
    pealkiri: Eesti Segakooride Liidu emakeelepäeva kontsert "SÕNAST HÄÄLENI KASVADES"
    asukoht: 14. märtsil 2026 kell 17.00 Estonia kontserdisaalis
    sisu: |
        Eesti segakooride liit esitleb:
        
        <b>Eesti Raamatu Aasta lõpetamisele pühendatud kontsert "SÕNAST HÄÄLENI KASVADES"</b>

        Emakeelepäeval kõlab pidulik kontsert, mis on pühendatud Eesti Raamatu Aasta lõpetamisele ning viib kuulaja rännakule sõnast hääleni ja mõttest muusikani. Laval kohtuvad sajad lauljad, eriilmelised koorid ja improvisatsioon, et üheskoos tähistada eesti keele väge, kõla ja elujõudu.

        Kavas: M. Valkonen, Tõnu Kõrvits, Veljo Tormis, Cyrillus Kreek jt.
        
        Kontserdi kunstilised juhid Küllike Joosing ja Eve Paap

        Lavastaja Anna Laura Ilves

        Etenduskunstnik Erko Sild

        Kontserdil esinevad:

        Segakoor Hannijöggi
        Tabasalu Kammerkoor
        Hugo Treffneri Gümnaasiumi segakoor Anima
        Eesti Rahvusringhäälingu Segakoor
        Tartu Üliõpilassegakoor
        Viljandimaa Kammerkoor

        Piletid:
        <a href="https://www.piletilevi.ee/piletid/ESEIQLQAEN/eesti-segakooride-liidu-emakeelepaeva-kontsert-sonast-haaleni-kasvades" target="_blank" rel="noopener">Piletilevis</a>
        
        Sündmus:
        <a href="https://fb.me/e/6CjWNjgIu" target="_blank" rel="noopener">Facebookis</a>

